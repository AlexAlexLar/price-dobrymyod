  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #fffdf6;
      font-family: sans-serif;
      font-size: 16px;
      height: 100%;
      overflow: hidden;
    }
    .top-bar {
      background: #f8e6a0;
      padding: 10px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 10;
    }
    .top-bar a {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      background: #d8b448;
      color: #fff;
      padding: 8px 12px;
      border-radius: 10px;
      font-weight: bold;
      transition: 0.3s;
      font-size: 14px;
      white-space: nowrap;
      flex: 1 1 auto;
      min-width: 160px;
      max-width: 220px;
    }
    .top-bar a:hover {
      background: #b9942f;
    }
    .top-bar img {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }
    .content {
      position: absolute;
      top: 80px;
      bottom: 0;
      left: 0;
      right: 0;
    }
    iframe {
      border: none;
      width: 100%;
      height: 100%;
    }
    @media (max-width: 600px) {
      .top-bar {
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</head>
