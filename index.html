<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Прайс — Добрый мёд</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #fffdf6;
      font-family: sans-serif;
      font-size: 16px;
      height: 100%;
      overflow: hidden;
    }
    .top-bar {
      background: #f8e6a0;
      padding: 10px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 10;
    }
    .menu-column {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1 1 45%;
      min-width: 180px;
      align-items: center;
    }
    .top-bar a {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      background: #d8b448;
      color: #fff;
      padding: 8px 12px;
      border-radius: 10px;
      font-weight: bold;
      transition: 0.3s;
      font-size: 14px;
      white-space: nowrap;
      min-width: 160px;
      max-width: 220px;
    }
    .top-bar a:hover {
      background: #b9942f;
    }
    .top-bar img {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }
    .content {
      position: absolute;
      top: 100px;
      bottom: 0;
      left: 0;
      right: 0;
      overflow: auto;
    }
    .responsive-frame {
      width: 100%;
      height: 100%;
      overflow-x: auto;
    }
    iframe {
      border: none;
      min-width: 100%;
      height: 100%;
    }
    @media (min-width: 601px) {
      .top-bar {
        flex-wrap: nowrap;
        flex-direction: row;
      }
      .menu-column {
        flex-direction: row;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="menu-column">
      <a href="tel:+79210935990">
        <img src="A_3D-style_'Call'_button_icon_with_a_glossy_finish.png" alt="Позвонить"> Позвонить
      </a>
      <a href="price.pdf" download>
        <img src="A_3D-style_'Download'_button_icon_with_a_glossy,_m.png" alt="Скачать прайс"> Прайс
      </a>
    </div>
    <div class="menu-column">
      <a href="https://t.me/dobryjpchelovod" target="_blank">
        <img src="A_3D-style_Telegram_logo_icon_with_a_glossy,_moder.png" alt="Telegram"> Telegram
      </a>
      <a href="https://wa.me/79210935990" target="_blank">
        <img src="A_3D-style_WhatsApp_logo_icon_with_a_realistic_glo.png" alt="WhatsApp"> WhatsApp
      </a>
    </div>
  </div>

  <div class="content">
    <div class="responsive-frame">
      <iframe src="https://docs.google.com/spreadsheets/d/e/2PACX-1vR4S3qq_O0KEYbaOqUYMCfiQxgWsjxIIquSLJClXA5sGLVa3Mwe8zq3bnCAZnOPq4qq9nkrWChNpY2H/pubhtml?gid=2063201946&single=true&widget=true&headers=false"></iframe>
    </div>
  </div>

</body>
</html>
